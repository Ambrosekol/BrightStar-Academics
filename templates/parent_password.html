<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Password — {{ school_brand.name }}</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"></head><body class="unified-login-page"><main class="unified-login"><section class="unified-login-card"><p class="public-eyebrow">PARENT PORTAL</p><h1>Change password</h1>{% for e in errors %}<div class="login-error">{{e}}</div>{% endfor %}<form enctype="multipart/form-data" method="post"><input type="hidden" name="_csrf_token" value="{{csrf_token()}}"><label>Current password<input type="password" name="current_password" required></label><label>New password<input type="password" name="new_password" required></label><label>Confirm password<input type="password" name="confirm_password" required></label><button class="primary full" type="submit">Save password</button></form><p class="login-help-text"><a class="practice-inline-link" href="{{url_for('forgot_password')}}">Forgot password?</a></p></section></main></body></html>
