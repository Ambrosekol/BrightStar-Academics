<label for="chat-file-input" class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1 mb-0 custom-attach-btn" title="Attach file">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-paperclip" viewBox="0 0 16 16">
        <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0z"/>
    </svg>
    <span id="file-indicator-text">Attach</span>
    <input type="file" id="chat-file-input" name="attachment" accept="image/*,.pdf,.doc,.docx,.txt,.xls,.xlsx" class="d-none" onchange="updateFileIndicator(this)">
</label>

<script>
function updateFileIndicator(input) {
    const textSpan = document.getElementById("file-indicator-text");
    const btn = input.closest("label");
    if (input.files && input.files[0]) {
        textSpan.textContent = input.files[0].name.length > 15 ? input.files[0].name.substring(0, 12) + "..." : input.files[0].name;
        btn.classList.remove("btn-outline-secondary");
        btn.classList.add("btn-success");
    } else {
        textSpan.textContent = "Attach";
        btn.classList.remove("btn-success");
        btn.classList.add("btn-outline-secondary");
    }
}
</script>
