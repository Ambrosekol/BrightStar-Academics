{% extends "platform/base.html" %}
{% block title %}Password{% endblock %}
{% block body %}
<div style="max-width:26rem">
  <h1>Change your platform password</h1>
  {% if error %}<div class="errors">{{ error }}</div>{% endif %}
  <form method="post" class="panel">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="current_password">Current password</label>
    <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
    <label for="new_password">New password <span class="hint">At least 10 characters.</span></label>
    <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
    <label for="confirm_password">Confirm new password</label>
    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
    <p><button class="btn btn-primary" type="submit">Change password</button></p>
  </form>
</div>
{% endblock %}
