<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrance Practice Test</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"></head><body class="student-portal-page"><main class="student-dashboard-shell"><section class="student-hero"><div><p class="student-eyebrow">ENTRANCE PRACTICE</p><h1>{{'JSS 1' if config.entry_group=='year7' else 'SSS 1'}} · {{config.subject|replace('_',' ')|title}}</h1><p>{{config.questions_to_serve}} questions · Historical paper</p></div></section><form method="post">{% for q in questions %}<article class="student-panel" style="margin:18px 0"><h3>Q{{loop.index}}. {{q.text}}</h3><div>{% for o in q.options %}<label style="display:block;margin:9px 0"><input type="radio" name="q_{{q.id}}" value="{{loop.index0}}"> {{'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[loop.index0]}}. {{o}}</label>{% endfor %}</div></article>{% endfor %}<button class="primary full" type="submit">Submit practice test</button></form></main></body></html>
