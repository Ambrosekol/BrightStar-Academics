{% extends "platform/base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block body %}
<p class="crumb"><a href="{{ back_url }}">&larr; Settings</a></p>
<div class="page-head">
  <div>
    <div class="eyebrow">Shown once</div>
    <h1>{{ heading }}</h1>
  </div>
</div>

<div class="panel" style="max-width:40rem">
  <span class="secret">{{ secret }}</span>
  <p class="muted">{{ lead }}</p>
  <p style="margin-bottom:0">This is shown here and nowhere else, and cannot be retrieved later.</p>
</div>
<p style="margin-top:18px"><a class="btn btn-primary" href="{{ back_url }}">Back to Settings</a></p>
{% endblock %}
