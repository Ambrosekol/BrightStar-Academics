<div class="table-wrap">
  <table class="log table-stack">
    <thead><tr><th>When</th><th>Action</th><th>By</th><th>Details</th></tr></thead>
    <tbody>
      {% for row in audit %}
        <tr>
          <td class="when" data-label="When">{{ row.created_at|platform_time }}</td>
          <td data-label="Action"><span class="what">{{ row.action|describe_action }}</span></td>
          <td data-label="By">{{ row.actor or 'command line' }}</td>
          <td class="detail" data-label="Details">{{ row.detail or '' }}</td>
        </tr>
      {% else %}
        <tr><td colspan="4" class="empty" data-label="">Nothing recorded yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
