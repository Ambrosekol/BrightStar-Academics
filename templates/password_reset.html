<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — {{ school_brand.name }}</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"></head><body class="unified-login-page"><main class="unified-login"><section class="unified-login-card"><div class="public-brand-logo"><img src="{{school_brand.logo_url}}" alt="{{ school_brand.name }} logo"></div><p class="public-eyebrow">ACCOUNT RECOVERY</p><h1>Set a new password</h1>{% for e in errors %}<div class="login-error">{{e}}</div>{% endfor %}{% if valid %}<form method="post"><label>New password<input type="password" name="new_password" minlength="8" required autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></label><button class="primary full" type="submit">Reset password</button></form>{% else %}<p class="muted">Please request a new password-reset email from the sign-in page.</p>{% endif %}</section></main></body></html>
