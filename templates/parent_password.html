{% extends 'auth_base.html' %}
{% block title %}Parent Password — {{ school_brand.name }}{% endblock %}
{% block card %}
        <h1 class="auth-title">Change password</h1>
        <p class="auth-lead">Parent Portal. Choose a private password before you continue.</p>

        {% for e in errors %}<div class="ui-alert ui-alert--error" role="alert">{{e}}</div>{% endfor %}

        <form class="auth-form" enctype="multipart/form-data" method="post">
          <input type="hidden" name="_csrf_token" value="{{csrf_token()}}">
          <div class="ui-field">
            <label for="current_password">Current password</label>
            <input class="ui-input" id="current_password" type="password" name="current_password" required autocomplete="current-password" autofocus>
          </div>
          <div class="ui-field">
            <label for="new_password">New password</label>
            <input class="ui-input" id="new_password" type="password" name="new_password" required autocomplete="new-password">
          </div>
          <div class="ui-field">
            <label for="confirm_password">Confirm password</label>
            <input class="ui-input" id="confirm_password" type="password" name="confirm_password" required autocomplete="new-password">
          </div>
          <button class="ui-btn ui-btn--primary ui-btn--block" type="submit">Save password</button>
        </form>

        <p class="auth-help"><a class="ui-link" href="{{url_for('forgot_password')}}">Forgot password?</a></p>
{% endblock %}
