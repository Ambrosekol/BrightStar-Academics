<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% include 'includes/_pwa_head.html' %}
<title>Offline — {{ brand.name }}</title>
<style>
  /* What the installed app shows with no connection (blueprints/pwa.py): the school's own logo and colour. */
  :root { --brand: {{ primary }}; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: color-mix(in srgb, var(--brand) 80%, #000); background: color-mix(in srgb, var(--brand) 6%, #fff); }
  main { max-width: 380px; text-align: center; }
  img { width: 72px; height: 72px; object-fit: contain; border-radius: 16px; background: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--brand) 16%, transparent); }
  h1 { margin: 18px 0 6px; font-size: 22px; color: var(--brand); }
  p { margin: 0 0 20px; color: color-mix(in srgb, var(--brand) 55%, #555); }
  a { display: inline-block; padding: 11px 22px; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
{{ connectivity_banner() }}
<main>
  <img src="{{ pwa_icon_url(192) }}" alt="{{ brand.name }}">
  <h1>You are offline</h1>
  <p>{{ brand.name }} needs a connection. Check your data or Wi-Fi, then try again.</p>
  <a href="/">Try again</a>
</main>
</body>
</html>
